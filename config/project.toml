[run]
random_seed = 42

[source]
url = "https://archive.ics.uci.edu/static/public/321/electricityloaddiagrams20112014.zip"
filename = "electricityloaddiagrams20112014.zip"
member = "LD2011_2014.txt"
title = "ElectricityLoadDiagrams20112014"
creator = "Artur Trindade"
doi = "10.24432/C58C86"
license = "CC BY 4.0"

[audit]
interval_minutes = 15
expected_intervals_per_day = 96
activation_window_days = 14
activation_positive_days = 10
exclude_dst_transition_days = true
extreme_median_multiplier = 2.0
extreme_p99_multiplier = 1.5

[study]
training_start = "2012-01-01"
training_end = "2013-12-31"
minimum_valid_training_days = 180
selection_start = "2014-01-01"
selection_end = "2014-03-31"
calibration_start = "2014-04-01"
calibration_end = "2014-06-30"
test_start = "2014-07-01"
test_end = "2014-12-31"

[labels]
threshold_estimator = "nearest_rank"
threshold_percentile = 0.9

[examples]
history_window_days = 14
min_history_valid_days = 12
weekly_lag_max_weeks = 4
high_use_percentile = 0.75

[experiment]
evaluation_splits = ["selection"]
alert_budget_fraction = 0.10
weekly_smoothing_strength = 10.0

[models]
selection_metric = "average_precision"
max_iter_logistic = 2000
hgb_max_iter = 200
logistic_C = [0.01, 0.1, 1.0, 10.0]
hgb_learning_rate = [0.05, 0.1]
hgb_max_leaf_nodes = [15, 31, 63]
hgb_min_samples_leaf = [50, 200]
hgb_l2_regularization = 1.0
calibration_method = "platt"
calibration_cv_folds = 5
